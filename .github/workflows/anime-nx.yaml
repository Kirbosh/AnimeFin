name: anime-nx

# Builds the Nintendo Switch .nro for the AnimeFin feature branch and uploads it
# as a downloadable artifact. Mirrors the upstream build-nx job (both the OpenGL
# and deko3d drivers) so it stays on the proven toolchain recipe. Runs on every
# push to the branch and can also be started manually from the Actions tab.

on:
  push:
    branches: [ claude/ripjkanimenx-poster-player-siuuw8 ]
    paths-ignore:
    - README.md
    - CHANGELOG.md
    - images/**
  workflow_dispatch:

jobs:
  build-nx:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    env:
      BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/switch-portlibs
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Update dependencies (deko3d driver)
      run: |
        dkp-pacman --noconfirm -R switch-libmpv
        dkp-pacman --noconfirm -U $BASE_URL/libuam-master-1-any.pkg.tar.zst
        dkp-pacman --noconfirm -U $BASE_URL/hacBrewPack-3.05-1-x86_64.pkg.tar.zst
        for pkg in mbedtls-3.6.5-1 libssh2-1.11.1-1 dav1d-1.5.3-1 curl-8.16.0-2 ffmpeg-7.1.5-5 libmpv-deko3d-0.36.0-5 nspmini-main-1; do
          dkp-pacman --noconfirm -U $BASE_URL/switch-${pkg}-any.pkg.tar.zst
        done
        git config --system --add safe.directory $GITHUB_WORKSPACE
    - name: Build libusbhsfs
      run: |
        git clone https://github.com/DarkMatterCore/libusbhsfs.git --depth=1
        make -C libusbhsfs BUILD_TYPE=GPL install -j$(nproc)
    - name: Build nro
      run: |
        cmake -B build -DUSE_DEKO3D=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_SWITCH=ON \
          -DUSE_LIBUSBHSFS=ON \
          -DBUILTIN_NSP=ON \
          -DVERSION_BUILD=${{ github.run_number }}
        make -C build Switchfin.nro -j$(nproc)
        cp build/Switchfin.nro AnimeFin.nro
    - name: Upload nro
      uses: actions/upload-artifact@v6
      with:
        name: AnimeFin-NintendoSwitch-${{ github.run_number }}
        path: AnimeFin.nro

  # Publish the .nro to a rolling pre-release so it shows up under "Releases"
  # with a permanent, no-login download link that works on mobile.
  release:
    needs: build-nx
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download built nro
      uses: actions/download-artifact@v6
      with:
        path: dist
    - name: Collect nro
      run: |
        mkdir -p out
        find dist -name '*.nro' -exec cp {} out/ \;
        ls -l out
    - name: Reset rolling release (drop stale assets)
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete anime-latest --repo ${{ github.repository }} -y || true
    - name: Publish rolling pre-release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: anime-latest
        name: AnimeFin — latest build
        body: |
          Automated build of the `claude/ripjkanimenx-poster-player-siuuw8` branch (deko3d).

          Copy **AnimeFin.nro** to `/switch/` on your SD card and launch it from the hbmenu.
          Opens into AnimeFLV; press **X** to switch source, **Y** to sort/search.
          If anything breaks, send `sdmc:/switch/Switchfin/anime_diag.log`
          (and any `diag_*.txt`).

          Built from commit ${{ github.sha }} (run ${{ github.run_number }}).
        prerelease: true
        files: out/*.nro
